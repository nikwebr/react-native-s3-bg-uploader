name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '26 0 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, ruby, rust]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4.37.3
        with:
          category: "/language:${{ matrix.language }}"

  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Install cbindgen
        run: cargo install cbindgen
      - name: Install JS dependencies
        run: bun install
      - name: Generate iOS native bindings
        run: bun run build:ios
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: swift,c-cpp
          build-mode: manual
      - name: Install CocoaPods
        working-directory: example/ios
        run: pod install
      - name: Build
        working-directory: example/ios
        run: |
          set -o pipefail && xcodebuild \
            CC=clang CPLUSPLUS=clang++ LD=clang LDPLUSPLUS=clang++ \
            -derivedDataPath build -UseModernBuildSystem=YES \
            -workspace S3BgUploaderExample.xcworkspace \
            -scheme S3BgUploaderExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            build \
            CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@v4.37.3
        with:
          category: "/language:swift+c-cpp"

  analyze-java-kotlin:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Install JS dependencies
        run: bun install
      - name: Generate Android native bindings
        run: bun run build:android
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: java-kotlin,c-cpp
          build-mode: manual
      - name: Build
        working-directory: example/android
        run: ./gradlew assembleDebug --no-daemon --build-cache
      - name: Stop Gradle daemon
        working-directory: example/android
        run: ./gradlew --stop
      - uses: github/codeql-action/analyze@v4.37.3
        with:
          category: "/language:java-kotlin+c-cpp"
