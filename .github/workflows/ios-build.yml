name: Build iOS

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

env:
  USE_CCACHE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS Example App
    runs-on: macOS-26
    timeout-minutes: 60
    env:
      # Cold hosted simulators can take several minutes to start XCTest.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '600000'
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.2

      - name: Install dependencies (bun)
        run: bun install

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Install E2E tools
        run: |
          python -m venv e2e/.venv
          e2e/.venv/bin/pip install -r e2e/requirements.txt
          bash e2e/install-maestro.sh

      - name: Setup Ruby (bundle)
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: example

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            ~/.cocoapods/repos
            example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Build
        run: npm run build:ios
      - name: Test native upload race regressions
        run: |
          cargo test --locked --manifest-path uploader/Cargo.toml native::upload_engine::tests
          cargo test --locked --manifest-path uploader/Cargo.toml -p nyquest-backend-nsurlsession --lib stream::ns_stream::tests
      - name: Install Pods
        working-directory: example/ios
        run: npm run pod
      

      - name: Build App
        working-directory: example/ios
        run: |
          set -o pipefail && xcodebuild \
            CC=clang CPLUSPLUS=clang++ LD=clang LDPLUSPLUS=clang++ \
            -derivedDataPath build -UseModernBuildSystem=YES \
            -workspace S3BgUploaderExample.xcworkspace \
            -scheme S3BgUploaderExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            build \
            CODE_SIGNING_ALLOWED=NO | xcpretty

      - name: Boot test simulator
        run: |
          device_info=$(xcrun simctl list devices available --json | python -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          device = next(d for group in devices.values() for d in group if d["name"] == "iPhone 17")
          print(device["udid"], device["state"])
          ')
          read -r device state <<< "$device_info"
          echo "E2E_DEVICE=$device" >> "$GITHUB_ENV"
          if [[ "$state" != Booted ]]; then xcrun simctl boot "$device"; fi
          xcrun simctl bootstatus "$device" -b
      - name: Maestro upload, pause/resume and download tests
        run: bash e2e/run.sh ios
      - name: Install custom example dependencies
        run: npm ci --prefix custom-encryption-example/example-app
      - name: Build custom encryptor and independent verifier
        run: |
          bash custom-encryption-example/build-rust-lib.sh
          cargo build --release --locked --manifest-path custom-encryption-example/tools/decrypt/Cargo.toml
      - name: Install custom example Pods
        working-directory: example
        run: bundle exec pod install --project-directory=../custom-encryption-example/example-app/ios
      - name: Build custom example simulator app
        working-directory: custom-encryption-example/example-app/ios
        run: |
          set -o pipefail && xcodebuild \
            CC=clang CPLUSPLUS=clang++ LD=clang LDPLUSPLUS=clang++ \
            -derivedDataPath build -UseModernBuildSystem=YES \
            -workspace CustomEncryptionExample.xcworkspace \
            -scheme CustomEncryptionExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            build CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Maestro custom encryption upload and download tests
        run: bash e2e/run.sh ios custom
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: maestro-ios
          path: |
            e2e/artifacts/ios
            e2e/artifacts/custom/ios
