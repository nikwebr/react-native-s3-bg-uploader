name: Build Web

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WASM lib + Web App
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: uploader

    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies (bun)
        working-directory: .
        run: bun install
      - name: Test 100%-to-completion deadline boundaries
        working-directory: .
        run: bun test example/e2e/completionTiming.test.mts

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Install E2E tools
        working-directory: .
        run: |
          python -m venv e2e/.venv
          e2e/.venv/bin/pip install -r e2e/requirements.txt
          bash e2e/install-maestro.sh
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            uploader/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('uploader/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.118 --locked

      - name: Build WASM library
        run: ./scripts/build.sh wasm

      - name: Build independent custom encryption verifier
        working-directory: .
        run: cargo build --release --locked --manifest-path custom-encryption-example/tools/decrypt/Cargo.toml
      - name: Test download/decryption oracle for both encryptors
        working-directory: .
        run: e2e/.venv/bin/python -m unittest discover -s e2e -p 'test_*.py'
      - name: Install custom example dependencies
        working-directory: .
        run: npm ci --prefix custom-encryption-example/example-app
      - name: Build custom AES-GCM WASM encryptor
        working-directory: custom-encryption-example/custom-encryptor-rust
        run: |
          cargo build --locked --features wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --out-dir target/wasm --target no-modules \
            target/wasm32-unknown-unknown/release/custom_encryptor.wasm
          node scripts/embed-wasm.js

      - name: Build example web app
        working-directory: example
        run: npx webpack --config webpack.config.js --mode production

      - name: Build E2E web app
        working-directory: example
        run: E2E=1 npx webpack --config webpack.config.js --mode production
      - name: Maestro upload, pause/resume and download tests
        working-directory: .
        run: bash e2e/run.sh web
      - name: Build custom E2E web app
        working-directory: custom-encryption-example/example-app
        run: E2E=1 npx webpack --config webpack.config.js --mode production
      - name: Maestro custom encryption upload and download tests
        working-directory: .
        run: bash e2e/run.sh web custom
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: maestro-web
          path: |
            e2e/artifacts/web
            e2e/artifacts/custom/web
