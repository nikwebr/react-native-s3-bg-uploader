name: Build Android

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Example App
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies (bun)
        run: bun install

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install E2E tools
        run: |
          python -m venv e2e/.venv
          e2e/.venv/bin/pip install -r e2e/requirements.txt
          bash e2e/install-maestro.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            uploader/target
          key: ${{ runner.os }}-rust-${{ hashFiles('uploader/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate Nitro bindings
        run: bun run build:android

      - name: Run Gradle build
        working-directory: example/android
        run: ./gradlew assembleDebug --no-daemon --build-cache

      - name: Stop Gradle daemon
        working-directory: example/android
        run: ./gradlew --stop

      - name: Install custom example dependencies
        run: npm ci --prefix custom-encryption-example/example-app
      - name: Build independent custom encryption verifier
        run: cargo build --release --locked --manifest-path custom-encryption-example/tools/decrypt/Cargo.toml
      - name: Build custom AES-GCM native encryptor
        working-directory: custom-encryption-example/custom-encryptor-rust
        run: |
          cargo ndk --platform 24 \
            -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            -o ../example-app/android/app/src/main/jniLibs build --release --locked
      - name: Build custom example debug APK
        working-directory: custom-encryption-example/example-app/android
        run: ./gradlew assembleDebug --no-daemon --build-cache

      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Maestro upload, pause/resume and download tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash e2e/run.sh android
            bash e2e/run.sh android custom
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: maestro-android
          path: |
            e2e/artifacts/android
            e2e/artifacts/custom/android
