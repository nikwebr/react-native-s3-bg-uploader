appId: ${APP_ID}
---
- tapOn: Upload unencrypted fixture
- runFlow: pause-resume.yaml
- tapOn: Verify download
- extendedWaitUntil:
    visible: "Unencrypted download verified; bytes match fixture"
    timeout: 30000
- assertNotVisible: "E2E error:.*"
- takeScreenshot: plain-verified
- tapOn: Upload encrypted fixture
- runFlow: pause-resume.yaml
- tapOn: Verify download
- extendedWaitUntil:
    visible: "Encrypted download verified; correct key decrypts; wrong key rejected"
    timeout: 30000
- assertNotVisible: "E2E error:.*"
- takeScreenshot: encrypted-verified
- tapOn: Test hash salt
- extendedWaitUntil:
    visible: Hash salt verified for plain and encrypted uploads
    timeout: 60000
- assertNotVisible: "E2E error:.*"
- takeScreenshot: hash-salt-verified
- tapOn: Test network retry
- extendedWaitUntil:
    visible: plain network recovery verified
    timeout: 120000
- assertNotVisible: "E2E error:.*"
- takeScreenshot: network-retry-verified
- tapOn: Test network resume
- extendedWaitUntil:
    visible: encrypted network recovery verified
    timeout: 120000
- assertNotVisible: "E2E error:.*"
- takeScreenshot: network-resume-verified
- tapOn: Cancel upload
# The app cancels mid-upload, then waits for the backend to confirm that the
# cancelUpload request arrived and S3 dropped the multipart upload and its parts.
- extendedWaitUntil:
    visible: Cancellation verified
    timeout: 90000
- assertNotVisible: "E2E error:.*"
- takeScreenshot: cancellation-verified
