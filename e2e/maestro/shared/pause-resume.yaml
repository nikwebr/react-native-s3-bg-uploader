appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: "Completed parts: 1"
    timeout: 60000
- tapOn: Pause upload
# The app verifies the pause itself: up to 10s to reach PAUSED, then a 5s quiet
# window (in-flight parts are allowed to finish) with a 45s ceiling.
- extendedWaitUntil:
    visible: Pause verified
    timeout: 90000
- assertNotVisible: Upload completed
- assertNotVisible: "E2E error:.*"
- tapOn: Resume upload
- extendedWaitUntil:
    visible: Upload completed
    timeout: 120000
- assertNotVisible: "E2E error:.*"
- assertVisible: Completion within 20 seconds verified
# The resumed run drops one part PUT after its body arrived, so completion needs a
# retry of a part whose bytes were already counted. The app only shows this when the
# bar never went backwards and never claimed 100% before COMPLETED.
- extendedWaitUntil:
    visible: Network error retried without losing progress
    timeout: 30000
