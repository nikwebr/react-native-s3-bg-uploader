# Respond to a submitted review whose body mentions @agent-serviceuser.
name: agent-serviceuser-review
on: github.pull_request_review
max_runtime: 2h
filters:
  repo: nikwebr/react-native-s3-bg-uploader
  connection: nikwebr-github
  contains: "@agent-serviceuser"
  from_users: [nikwebr]
steps:
  - id: respond
    environment: dev
    max_runtime: 45m
    idle_timeout: 10m
    agent: codex
    prompt:
      - include: partials/agent-serviceuser.md
      - text: |
          <event-context>
          ${{ paseo.context }}
          </event-context>

          <triggering-text>
          ${{ paseo.prompt }}
          </triggering-text>
