# Respond to a changed-line review comment only when pi-agent-assignee is present.
name: agent-serviceuser-assignee-review-comment
on: github.pull_request_review_comment
max_runtime: 2h
filters:
  repo: nikwebr/react-native-s3-bg-uploader
  connection: agent-serviceuser-github
  labels: [pi-agent-assignee]
  from_users: [nikwebr]
steps:
  - id: respond
    environment: dev
    max_runtime: 45m
    idle_timeout: 10m
    agent: pi
    github:
      connection: agent-serviceuser-github
      repositories: [nikwebr/react-native-s3-bg-uploader]
      permissions:
        actions: read
        checks: read
        contents: write
        issues: write
        pull_requests: write
    prompt:
      - include: partials/agent-serviceuser.md
      - text: |
          <event-context>
          ${{ paseo.context }}
          </event-context>

          <triggering-text>
          ${{ paseo.prompt }}
          </triggering-text>
