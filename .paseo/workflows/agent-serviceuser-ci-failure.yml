# Fix CI failures reported by the GitHub Actions failure-comment bridge.
name: agent-serviceuser-ci-failure
on: github.pull_request_comment_created
max_runtime: 2h
filters:
  repo: nikwebr/react-native-s3-bg-uploader
  connection: nikwebr-github
  labels: [pi-agent-assignee]
  contains: "@agent-serviceuser"
  from_users: ["github-actions[bot]"]
steps:
  - id: fix
    environment: dev
    max_runtime: 45m
    idle_timeout: 10m
    agent: codex
    prompt:
      - include: partials/agent-serviceuser.md
      - text: |
          This comment was posted automatically because CI failed on this pull
          request. Treat it as a request to fix the failing checks and continue
          the existing pull-request work.

          <event-context>
          ${{ paseo.context }}
          </event-context>

          <triggering-text>
          ${{ paseo.prompt }}
          </triggering-text>
