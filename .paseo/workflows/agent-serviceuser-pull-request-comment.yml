# Matches a conversation comment on a pull request that mentions @agent-serviceuser.
#
# GitHub delivers pull-request conversation comments as issue comments; Hub's
# semantic event separates them from issue comments.
name: agent-serviceuser-pull-request-comment
on: github.pull_request_comment_created
max_runtime: 2h
filters:
  repo: nikwebr/react-native-s3-bg-uploader
  connection: agent-serviceuser-github
  contains: "@agent-serviceuser"
  from_users: [nikwebr]
steps:
  - id: respond
    environment: dev
    max_runtime: 45m
    idle_timeout: 10m
    agent: pi
    github:
      connection: agent-serviceuser-github
      repositories: [nikwebr/react-native-s3-bg-uploader]
      permissions:
        actions: read
        checks: read
        contents: write
        issues: write
        pull_requests: write
    prompt:
      - include: partials/agent-serviceuser.md
      - text: |
          <event-context>
          ${{ paseo.context }}
          </event-context>

          <triggering-text>
          ${{ paseo.prompt }}
          </triggering-text>
