# Continue work when pi-agent-assignee is added to a pull request.
name: agent-serviceuser-assignee-pull-request-label
on: github.pull_request_label_added
max_runtime: 2h
filters:
  repo: nikwebr/react-native-s3-bg-uploader
  connection: nikwebr-github
  label: pi-agent-assignee
  from_users: [nikwebr]
steps:
  - id: respond
    environment: dev
    max_runtime: 45m
    idle_timeout: 10m
    agent: codex
    prompt:
      - include: partials/agent-serviceuser.md
      - text: |
          <event-context>
          ${{ paseo.context }}
          </event-context>

          <triggering-text>
          ${{ paseo.prompt }}
          </triggering-text>
