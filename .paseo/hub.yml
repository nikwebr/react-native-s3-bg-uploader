# Paseo Hub resources for the GitHub agent.
#
# The Hub daemon slug is the daemon registered with the Hub organization; the
# cwd is the checkout Hub works in. Codex is used because Hub unattended runs
# require a provider that can preapprove exact MCP tools. Codex is configured
# with the DeepSeek provider on the daemon.
environments:
  dev:
    kind: daemon
    daemon: agent
    cwd: /home/ubuntu/projects/react-native-s3-bg-uploader

agents:
  codex:
    provider: codex
    model: deepseek-flash
    mode: full-access
