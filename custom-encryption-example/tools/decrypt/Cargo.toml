[package]
name = "decrypt-verify"
version = "0.1.0"
edition = "2021"
description = "Standalone verifier for objects produced by react-native-s3-bg-uploader with a chunk encryptor"

# Standalone on purpose: keep it out of any parent workspace.
[workspace]

[dependencies]
# Same versions the shipped implementations use:
#   custom-encryptor-rust (aes-gcm) and uploader (chacha20poly1305).
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
