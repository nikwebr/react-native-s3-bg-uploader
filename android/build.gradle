buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.8.0"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: 'org.jetbrains.kotlin.android'
apply from: '../nitrogen/generated/android/S3BgUploader+autolinking.gradle'
apply from: "./fix-prefab.gradle"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["S3BgUploader_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["S3BgUploader_" + name]).toInteger()
}

android {
  namespace "com.s3bguploader"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
        "META-INF",
        "META-INF/**",
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libfolly_json.so",
        "**/libfolly_runtime.so",
        "**/libglog.so",
        "**/libhermes.so",
        "**/libhermes-executor-debug.so",
        "**/libhermes_executor.so",
        "**/libreactnative.so",
        "**/libreactnativejni.so",
        "**/libturbomodulejsijni.so",
        "**/libreact_nativemodule_core.so",
        "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          // React Codegen files
          "${project.buildDir}/generated/source/codegen/java"
        ]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}

// ── Rust / cargo-ndk build ──────────────────────────────────────────────────
def uploaderDir = new File(projectDir, "../uploader").canonicalPath
def jniLibsDir = new File(projectDir, "src/main/jniLibs").canonicalPath

// ABI → cargo-ndk target mapping
def abiToTarget = [
  "arm64-v8a"    : "arm64-v8a",
  "armeabi-v7a"  : "armeabi-v7a",
  "x86_64"       : "x86_64",
  "x86"          : "x86",
]

task buildRustAndroid {
  def abis = reactNativeArchitectures()
  inputs.dir("$uploaderDir/src")
  inputs.file("$uploaderDir/Cargo.toml")
  outputs.dir(jniLibsDir)

  doLast {
    def buildType = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") } ? "release" : "debug"
    def cargoFlags = buildType == "release" ? ["--release"] : []

    abis.each { abi ->
      def cmd = ["cargo", "ndk", "-t", abi, "build", "--features", "android"] + cargoFlags
      def proc = new ProcessBuilder(cmd)
          .directory(new File(uploaderDir))
          .inheritIO()
          .start()
      def exitCode = proc.waitFor()
      if (exitCode != 0) {
        throw new Exception("cargo ndk failed for $abi (exit $exitCode)")
      }

      // copy .so into jniLibs/<abi>/
      def targetSubdir = buildType == "release" ? "release" : "debug"
      def soSrc = new File("$uploaderDir/target/${abiToNdkRustTarget(abi)}/$targetSubdir/libuploader.so")
      def soDestDir = new File("$jniLibsDir/$abi")
      soDestDir.mkdirs()
      java.nio.file.Files.copy(
          soSrc.toPath(),
          new File(soDestDir, "libuploader.so").toPath(),
          java.nio.file.StandardCopyOption.REPLACE_EXISTING
      )
    }
  }
}

def abiToNdkRustTarget(String abi) {
  switch (abi) {
    case "arm64-v8a":    return "aarch64-linux-android"
    case "armeabi-v7a":  return "armv7-linux-androideabi"
    case "x86_64":       return "x86_64-linux-android"
    case "x86":          return "i686-linux-android"
    default: throw new Exception("Unknown ABI: $abi")
  }
}

preBuild.dependsOn buildRustAndroid
// ───────────────────────────────────────────────────────────────────────────

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // Add a dependency on NitroModules
  implementation project(":react-native-nitro-modules")
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "S3BgUploader"
    codegenJavaPackageName = "com.s3bguploader"
  }
}